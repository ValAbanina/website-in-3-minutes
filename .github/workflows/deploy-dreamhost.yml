name: Deploy to DreamHost

# Every push to main copies the site to https://demos.dgmd.ca/website-in-3-minutes/
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-dreamhost

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up the deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DREAMHOST_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H iad1-shared-b7-08.dreamhost.com >> ~/.ssh/known_hosts

      - name: Copy the site to demos.dgmd.ca/website-in-3-minutes
        run: |
          rsync -rlz --delete --exclude-from=.deployignore \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ dgmddemos@iad1-shared-b7-08.dreamhost.com:demos.dgmd.ca/website-in-3-minutes/
